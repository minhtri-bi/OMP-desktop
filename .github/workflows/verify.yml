name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-harness:
    name: Windows harness
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify with pinned OMP CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ompPath = Join-Path $env:RUNNER_TEMP 'omp.exe'
          $url = 'https://github.com/can1357/oh-my-pi/releases/download/v19.1.1/omp-windows-x64.exe'
          $expectedHash = '4e18f472975bb87f9b1992f1d5981b9a1403fd559cdb3eb96f1f1a7d709096ef'
          curl.exe --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --output $ompPath $url
          if ($LASTEXITCODE -ne 0) { throw "OMP download failed with exit code $LASTEXITCODE." }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $ompPath).Hash -ine $expectedHash) {
            throw 'OMP release hash mismatch.'
          }
          Remove-Item Env:OMP_PROFILE, Env:PI_PROFILE -ErrorAction SilentlyContinue
          $env:PI_CODING_AGENT_DIR = Join-Path $env:RUNNER_TEMP 'omp-harness-agent'
          ./scripts/check-harness.ps1 -OmpPath $ompPath
          ./scripts/probe-omp-rpc.ps1 -OmpPath $ompPath

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install, build, and verify Windows Electron app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath 'node_modules/electron/dist/electron.exe')) {
            node node_modules/electron/install.js
            if ($LASTEXITCODE -ne 0) { throw "Electron binary install failed with exit code $LASTEXITCODE." }
          }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed with exit code $LASTEXITCODE." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "build failed with exit code $LASTEXITCODE." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed with exit code $LASTEXITCODE." }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "Windows Electron E2E tests failed with exit code $LASTEXITCODE." }
